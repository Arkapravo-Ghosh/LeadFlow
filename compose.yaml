name: leadflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://leadflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@postgres:5432/leadflow
      BACKEND_API_KEY: ${BACKEND_API_KEY:?Set BACKEND_API_KEY in the root .env}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
          ignore: ["__pycache__/", "*.pyc"]
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
          initial_sync: true
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
      target: development
    environment:
      BACKEND_API_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY:?Set BACKEND_API_KEY in the root .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/public
          initial_sync: true
        - action: sync+restart
          path: ./frontend/next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: leadflow_test
      POSTGRES_USER: leadflow_test
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow_test -d leadflow_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: ./backend
      target: development
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://leadflow_test:isolated-test-password@db-test:5432/leadflow_test
      TEST_DATABASE_URL: postgresql://leadflow_test:isolated-test-password@db-test:5432/leadflow_test
      BACKEND_API_KEY: isolated-tests-service-key
    command: sh -c "uv run alembic upgrade head && uv run pytest"
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres-data:
