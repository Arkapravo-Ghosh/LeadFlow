# Use a disposable PostgreSQL database for API and browser validation.
# Invoke with: docker compose --profile test -f compose.yaml -f compose.test.yaml ...
services:
  backend:
    environment:
      DATABASE_URL: postgresql://leadflow_test:isolated-test-password@db-test:5432/leadflow_test
    depends_on:
      db-test:
        condition: service_healthy
